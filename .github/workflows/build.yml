name: Build APKs

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = 常规构建/发布; rules-only = 仅更新规则与清单到最新 Release(不改 APK/不打 tag)"
        type: choice
        options: [ build, rules-only ]
        default: build

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'rules-only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing (only if secrets are configured)
        env:
          KS: ${{ secrets.BT_KEYSTORE_BASE64 }}
          SP: ${{ secrets.BT_STORE_PASSWORD }}
          KA: ${{ secrets.BT_KEY_ALIAS }}
          KP: ${{ secrets.BT_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "BT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "BT_STORE_PASSWORD=$SP"
              echo "BT_KEY_ALIAS=$KA"
              echo "BT_KEY_PASSWORD=$KP"
            } >> "$GITHUB_ENV"
            echo "Release signing configured from secrets."
          else
            echo "No signing secrets found; release APKs will be debug-signed."
          fi

      - name: Build modern + legacy APKs
        run: ./gradlew assembleModernRelease assembleLegacyRelease --console=plain --stacktrace

      - name: Collect release assets (fixed names for latest/download links)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/modern/release/*.apk dist/bluetooth-modern.apk
          cp app/build/outputs/apk/legacy/release/*.apk dist/bluetooth-legacy.apk
          cp app/src/main/resources/hook_rules.json dist/hook_rules.json
          python3 scripts/gen_update_manual.py --out dist/update-manual.json

      - name: Upload workflow artifacts (every build)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载哪个包？ / Which APK?

            | 包 | 适用框架 |
            |---|---|
            | **bluetooth-modern.apk** | 现代 LibXposed，LSPosed **API ≥ 102** |
            | **bluetooth-legacy.apk** | 经典 Xposed / 旧 LSPosed / EdXposed（含 **API < 102**） |

            - 两个包**功能相同**，按框架版本**二选一**安装，不要同装。
            - 现代包若提示「该模块需要更新的 Xposed 版本 102」，改用 **legacy** 包。
            - 作用域勾选 **com.android.bluetooth**；**legacy 包**还需勾选**本应用自身**（用于激活检测）。
            - `hook_rules.json` / `update-manual.json` 供 App 内「检查更新」使用，一般无需手动下载。

  rules-only:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'rules-only'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build manifest + rules (no APK rebuild)
        run: |
          mkdir -p dist
          cp app/src/main/resources/hook_rules.json dist/hook_rules.json
          python3 scripts/gen_update_manual.py --out dist/update-manual.json
          cat dist/update-manual.json

      - name: Upload to the latest Release (clobber existing assets)
        run: |
          LATEST="$(gh release view --json tagName -q .tagName)"
          echo "Updating release $LATEST"
          gh release upload "$LATEST" dist/update-manual.json dist/hook_rules.json --clobber
