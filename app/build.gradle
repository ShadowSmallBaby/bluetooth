plugins {
    id 'com.android.application'
}

android {
    namespace 'net.ankio.bluetooth'
    // Keep the legacy Xposed runtime while compiling against the current SDK.
    // Raising compile/target SDK does not remove support for Android 7+ devices.
    compileSdk 37

    defaultConfig {
        applicationId "net.ankio.bluetooth"
        minSdk 24
        targetSdk 37
        versionCode 13
        versionName "1.1.1"
        resourceConfigurations += ['en', 'zh-rCN']

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 设置支持的SO库架构
            abiFilters  'x86', 'armeabi-v7a', 'x86_64', 'arm64-v8a'
        }
    }

    signingConfigs {
        // Populated from environment variables (CI secrets) when present; otherwise the release
        // build falls back to the debug key so local/CI builds without secrets still succeed.
        release {
            def ksPath = System.getenv('BT_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('BT_STORE_PASSWORD')
                keyAlias System.getenv('BT_KEY_ALIAS')
                keyPassword System.getenv('BT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('BT_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }
    flavorDimensions "framework"
    productFlavors {
        // Modern LibXposed (API 102+): module.prop + java_init.list + XposedService bridge.
        modern { dimension "framework" }
        // Legacy Xposed (assets/xposed_init); runs on every LSPosed/EdXposed, incl. API < 102.
        legacy { dimension "framework" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    lint {
        // Release APKs here are debug-signed and shipped as CI artifacts; skip the vital lint
        // pass so a transient lint-tool download or a non-fatal warning never blocks the build.
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/ASL2.0',
                'META-INF/gson/FieldAttributes.txt',
                'META-INF/gson/LongSerializationPolicy.txt',
                'META-INF/gson/annotations.txt'
            ]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.browser:browser:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    //主题库
    implementation 'io.github.prathameshmm02.themeEngine:themeEngine:1.1.0'
    //状态栏
    implementation 'com.gitee.zackratos:UltimateBarX:dev-SNAPSHOT'
    //Html转换
    implementation 'dev.rikka.rikkax.html:html-ktx:1.1.2'
    //webdav
    implementation 'com.github.thegrizzlylabs:sardine-android:0.8'
    //匿名统计
    implementation 'com.flurry.android:analytics:14.2.0@aar'
    //gson
    implementation 'com.google.code.gson:gson:2.10.1'
    //异步操作
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    //权限请求 支持Androidx
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    //让你的适配器一目了然，告别代码冗余
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    //Xposed组件库
    // The module still uses the legacy callback API so it remains compatible
    // with LSPosed legacy mode and older EdXposed installations.
    compileOnly 'de.robv.android.xposed:api:82'
    // Optional modern LibXposed API. Legacy frameworks ignore this metadata.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Modern LibXposed service (modern flavor only): activation + remote-preference bridge.
    modernImplementation 'io.github.libxposed:service:102.0.0'
}
